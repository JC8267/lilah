[project]
name = "lilah-backend"
version = "0.1.0"
description = "NL Survey Analytics API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "duckdb>=1.1.0",
    "anthropic>=0.40.0",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.1.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
